[package]
name = "yaobow_editor"
version = "0.1.0"
authors = ["Li Shengqiu <lishengqiu.hit@gmail.com>"]
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
asset_project = { path = "../asset_project" }
byteorder = "1.3.4"
chardet = "0.2.4"
common = { path = "../common" }
crosscom = { path = "../../crosscom/runtime/rust" }
encoding = "0.2.33"
fileformats = { path = "../fileformats" }
image = "0.23.0"
imgui = { workspace = true }
lazy_static = "1.2.0"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
lru = { version = "0.12.5" }
mini-fs = { workspace = true }
p7 = { path = "../../radiance/protosept/p7" }
radiance = { path = "../../radiance/radiance" }
radiance_editor = { path = "../../radiance/radiance_editor" }
radiance_scripting = { path = "../../radiance/radiance_scripting" }
packfs = { path = "../packfs" }
serde = "1.0"
serde_json = "1.0"
simple_logger = "4"
shared = { path = "../shared" }
uuid = "0.8"
wavefront_obj = "5.1.0"
xxtea = "0.2.0"

[build-dependencies]
crosscom-ccidl = { path = "../../crosscom/ccidl-rs" }
script-package = { path = "../../radiance/script-package", features = ["build"] }
serde_json = "1.0"

[dev-dependencies]
crosscom-protosept = { path = "../../crosscom/runtime/protosept" }
env_logger = "0.10"
# Only used to hand-pack minimal synthetic `.glb` fixtures for
# `services::import_service`'s tests (mirroring
# `shared::importers::test_support`, which is private to `shared` and
# not reusable here); not a runtime dependency of the editor itself.
gltf = { version = "1.4", default-features = false, features = ["utils", "extras"] }
# Only used by `services::import_service`'s "template replacement"
# test to build a minimal on-disk `.zip` package that
# `packfs::init_virtual_fs_with_catalog` can mount (giving the test a
# real, catalog-resolvable vfs path without needing any packfs
# changes). Version matches `tools/repacker`'s already-locked `zip`
# dependency.
zip = "7"
